name: HydraControl CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint, Security & Pytest Suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      DATABASE_URL: sqlite+aiosqlite:///./test_hydracontrol.db
      SYNC_DATABASE_URL: sqlite:///./test_hydracontrol.db
      TEST_DATABASE_URL: sqlite+aiosqlite:///./test_hydracontrol.db
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Verify Test Database Isolation
        run: |
          python -c "import sys; sys.path.extend(['.', 'backend']); from app.core.config import settings; print('Test DB URL:', settings.TEST_DATABASE_URL); assert 'test' in settings.TEST_DATABASE_URL.lower(), 'Test DB not isolated!'"

      - name: Run Pytest Regression Suite
        run: |
          pytest backend/tests/ -v --ignore=backend/tests/load_tests

      - name: Run Security Hardening Verification
        run: |
          pytest backend/tests/test_security_hardening.py -v

      - name: Run Observability Tests
        run: |
          pytest backend/tests/test_observability.py -v

      - name: Run Chaos Resiliency Tests
        run: |
          pytest backend/tests/chaos_tests/test_chaos.py -v

      - name: Run Full System E2E Tests
        run: |
          pytest backend/tests/test_full_system_e2e.py -v

  frontend-checks:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: TypeScript Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Frontend Bundle
        working-directory: frontend
        run: npm run build
