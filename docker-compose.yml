services:
  postgres:
    image: postgres:16-alpine
    container_name: hydracontrol_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydracontrol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hydracontrol"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt_broker:
    image: eclipse-mosquitto:2.0
    container_name: hydracontrol_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hydracontrol_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mqtt_broker:
        condition: service_started
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/hydracontrol
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hydracontrol
      - MQTT_BROKER_HOST=mqtt_broker
      - MQTT_BROKER_PORT=1883
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hydracontrol_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
